[build]
  publish = "public"
  functions = "netlify/functions"

# API Redirects & Serverless Routes
[[redirects]]
  from = "/api/photos"
  to = "/data/gallery.json"
  status = 200

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/benchmark"
  to = "/.netlify/functions/benchmark"
  status = 200

# Catch-all to support SPA fallback if needed
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
